version: '3.8'

services:
  # Standard executor configuration
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-scheduler
    ports:
      - "8080:8080"
    environment:
      - API_RATE_LIMIT_REQUESTS=1000
      - API_RATE_LIMIT_WINDOW_SECONDS=1
      - JOB_TIMEOUT_SECONDS=120
    command: ["--port=8080", "--workers=10", "--logfile=/dev/stdout"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - monitoring

  # Optimized executor configuration (high throughput)
  scheduler-optimized:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-scheduler-optimized
    ports:
      - "8081:8080"
    environment:
      - API_RATE_LIMIT_REQUESTS=10000
      - API_RATE_LIMIT_WINDOW_SECONDS=1
      - JOB_TIMEOUT_SECONDS=120
    command: ["--port=8080", "--workers=1000", "--optimized", "--logfile=/dev/stdout"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - monitoring
    profiles:
      - optimized

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
